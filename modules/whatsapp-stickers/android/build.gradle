apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
group = 'expo.modules.whatsappstickers'
version = '1.0.0'
android {
  namespace 'expo.modules.whatsappstickers'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    testInstrumentationRunner 'expo.modules.whatsappstickers.ConverterInstrumentation'
    externalNativeBuild { cmake { cppFlags '-std=c++17' } }
  }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
}
