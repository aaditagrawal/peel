name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PEEL_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21.0.8"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install web converter test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/peel-release.keystore"
      - name: Build and verify signed APK
        env:
          PEEL_KEYSTORE_PATH: ${{ runner.temp }}/peel-release.keystore
          PEEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PEEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PEEL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PEEL_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash scripts/build-apk.sh
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/peel-release.keystore"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Create as draft so Obtainium never sees a release without its APK.
          # An existing release is not overwritten; reruns cannot replace binaries.
          args=(--verify-tag --draft --generate-notes --title "Peel $PEEL_RELEASE_TAG")
          if [[ "$PEEL_RELEASE_TAG" == *-rc.* ]]; then args+=(--prerelease); fi
          gh release create "$PEEL_RELEASE_TAG" "${args[@]}" artifacts/release/*.apk artifacts/release/SHA256SUMS artifacts/release/release.json
          if [[ "$PEEL_RELEASE_TAG" == *-rc.* ]]; then
            gh release edit "$PEEL_RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$PEEL_RELEASE_TAG" --draft=false --latest
          fi
